name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and offline tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@10.14.0 install --no-frozen-lockfile

      - name: Typecheck
        run: corepack pnpm@10.14.0 typecheck

      - name: Run offline tests
        run: corepack pnpm@10.14.0 test
